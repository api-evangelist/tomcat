aid: tomcat
name: Apache Tomcat
description: >-
  Apache Tomcat is an open-source implementation of the Jakarta Servlet, Jakarta Server Pages, and other Jakarta EE
  technologies, providing a pure Java HTTP web server environment for running Java code. The Tomcat Manager application
  exposes an HTTP API for deploying, managing, and monitoring web applications. The JMX Proxy Servlet provides
  programmatic access to JMX MBeans for server diagnostics and configuration. Governed by the Apache Software
  Foundation.
