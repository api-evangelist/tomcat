naftiko: 1.0.0-alpha2
info:
  label: Apache Tomcat Manager API — Sessions
  description: 'Apache Tomcat Manager API — Sessions. 2 operations. Lead operation: Expire Sessions. Self-contained Naftiko
    capability covering one Tomcat business surface.'
  tags:
  - Tomcat
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TOMCAT_API_KEY: TOMCAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: manager-sessions
    baseUri: http://localhost:8080/manager
    description: Apache Tomcat Manager API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: text-expire
      path: /text/expire
      operations:
      - name: expiresessions
        method: GET
        description: Expire Sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: path
          in: query
          type: string
          description: Context path of the application
          required: true
        - name: idle
          in: query
          type: integer
          description: Minutes of inactivity (0 to expire all sessions)
          required: true
    - name: text-sessions
      path: /text/sessions
      operations:
      - name: getsessionstats
        method: GET
        description: Get Session Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: path
          in: query
          type: string
          description: Context path of the application
          required: true
        - name: version
          in: query
          type: string
    authentication:
      type: basic
      username: '{{env.TOMCAT_USER}}'
      password: '{{env.TOMCAT_PASS}}'
  exposes:
  - type: rest
    namespace: manager-sessions-rest
    port: 8080
    description: REST adapter for Apache Tomcat Manager API — Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/text/expire
      name: text-expire
      description: REST surface for text-expire.
      operations:
      - method: GET
        name: expiresessions
        description: Expire Sessions
        call: manager-sessions.expiresessions
        with:
          path: rest.path
          idle: rest.idle
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/text/sessions
      name: text-sessions
      description: REST surface for text-sessions.
      operations:
      - method: GET
        name: getsessionstats
        description: Get Session Statistics
        call: manager-sessions.getsessionstats
        with:
          path: rest.path
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: manager-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Tomcat Manager API — Sessions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: expire-sessions
      description: Expire Sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: manager-sessions.expiresessions
      with:
        path: tools.path
        idle: tools.idle
      outputParameters:
      - type: object
        mapping: $.
    - name: get-session-statistics
      description: Get Session Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: manager-sessions.getsessionstats
      with:
        path: tools.path
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
