naftiko: 1.0.0-alpha2
info:
  label: Apache Tomcat Application Management
  description: Unified capability for deploying, managing, and monitoring Java web applications on Apache Tomcat. Covers application
    deployment, lifecycle management (start/stop/reload), session management, server diagnostics, SSL configuration, and JMX
    access.
  tags:
  - Apache Tomcat
  - Java
  - Application Server
  - DevOps
  - Deployment
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TOMCAT_USERNAME: TOMCAT_USERNAME
    TOMCAT_PASSWORD: TOMCAT_PASSWORD
    TOMCAT_BASE_URL: TOMCAT_BASE_URL
capability:
  consumes:
  - type: http
    namespace: tomcat
    baseUri: '{{TOMCAT_BASE_URL}}/manager'
    description: Apache Tomcat Manager text interface
    authentication:
      type: basic
      username: '{{TOMCAT_USERNAME}}'
      password: '{{TOMCAT_PASSWORD}}'
    resources:
    - name: applications
      path: /text
      description: Web application lifecycle management
      operations:
      - name: list-applications
        method: GET
        description: List all deployed applications
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: start-application
        method: GET
        description: Start a stopped web application
        inputParameters:
        - name: path
          in: query
          type: string
          required: true
          description: Application context path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-application
        method: GET
        description: Stop a running web application
        inputParameters:
        - name: path
          in: query
          type: string
          required: true
          description: Application context path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: reload-application
        method: GET
        description: Reload a web application
        inputParameters:
        - name: path
          in: query
          type: string
          required: true
          description: Application context path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: undeploy-application
        method: GET
        description: Undeploy a web application
        inputParameters:
        - name: path
          in: query
          type: string
          required: true
          description: Application context path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: diagnostics
      path: /text
      description: Server diagnostics
      operations:
      - name: get-server-info
        method: GET
        description: Get server OS, JVM, and version information
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-thread-dump
        method: GET
        description: Get full JVM thread dump
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-vm-info
        method: GET
        description: Get JVM memory and system properties
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: tomcat-management-api
    description: Unified REST API for Tomcat application deployment and management.
    resources:
    - path: /v1/applications
      name: applications
      description: Web application listing
      operations:
      - method: GET
        name: list-applications
        description: List all deployed web applications
        call: tomcat.list-applications
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/applications/start
      name: application-start
      description: Start application
      operations:
      - method: POST
        name: start-application
        description: Start a stopped application
        call: tomcat.start-application
        with:
          path: rest.path
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/applications/stop
      name: application-stop
      description: Stop application
      operations:
      - method: POST
        name: stop-application
        description: Stop a running application
        call: tomcat.stop-application
        with:
          path: rest.path
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/applications/reload
      name: application-reload
      description: Reload application
      operations:
      - method: POST
        name: reload-application
        description: Reload an application
        call: tomcat.reload-application
        with:
          path: rest.path
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/diagnostics/server-info
      name: server-info
      description: Server information
      operations:
      - method: GET
        name: get-server-info
        description: Get server OS and JVM information
        call: tomcat.get-server-info
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/diagnostics/thread-dump
      name: thread-dump
      description: Thread dump
      operations:
      - method: GET
        name: get-thread-dump
        description: Get JVM thread dump
        call: tomcat.get-thread-dump
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/diagnostics/vm-info
      name: vm-info
      description: JVM information
      operations:
      - method: GET
        name: get-vm-info
        description: Get JVM memory and system info
        call: tomcat.get-vm-info
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: tomcat-management-mcp
    transport: http
    description: MCP server for AI-assisted Apache Tomcat application management.
    tools:
    - name: list-applications
      description: List all deployed web applications on Apache Tomcat
      hints:
        readOnly: true
        openWorld: false
      call: tomcat.list-applications
      outputParameters:
      - type: object
        mapping: $.
    - name: start-application
      description: Start a stopped web application on Tomcat
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: tomcat.start-application
      with:
        path: tools.path
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-application
      description: Stop a running web application on Tomcat (makes it unavailable)
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: tomcat.stop-application
      with:
        path: tools.path
      outputParameters:
      - type: object
        mapping: $.
    - name: reload-application
      description: Reload a Tomcat application to pick up WEB-INF/classes and lib changes
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: tomcat.reload-application
      with:
        path: tools.path
      outputParameters:
      - type: object
        mapping: $.
    - name: get-server-info
      description: Get Apache Tomcat server OS, JVM, and version information
      hints:
        readOnly: true
        openWorld: false
      call: tomcat.get-server-info
      outputParameters:
      - type: object
        mapping: $.
    - name: get-thread-dump
      description: Get a full JVM thread dump from Apache Tomcat for diagnostics
      hints:
        readOnly: true
        openWorld: false
      call: tomcat.get-thread-dump
      outputParameters:
      - type: object
        mapping: $.
    - name: get-vm-info
      description: Get JVM memory usage and system properties from Apache Tomcat
      hints:
        readOnly: true
        openWorld: false
      call: tomcat.get-vm-info
      outputParameters:
      - type: object
        mapping: $.
