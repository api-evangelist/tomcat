naftiko: "1.0.0-alpha1"

info:
  label: "Apache Tomcat Manager API"
  description: "Apache Tomcat Manager HTTP API for deploying, managing, and monitoring Java web applications and server diagnostics."
  tags:
    - Apache Tomcat
    - Java
    - Application Server
    - Deployment
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TOMCAT_USERNAME: TOMCAT_USERNAME
      TOMCAT_PASSWORD: TOMCAT_PASSWORD
      TOMCAT_BASE_URL: TOMCAT_BASE_URL

capability:
  consumes:
    - type: http
      namespace: tomcat
      baseUri: "{{TOMCAT_BASE_URL}}/manager"
      description: "Apache Tomcat Manager text interface"
      authentication:
        type: basic
        username: "{{TOMCAT_USERNAME}}"
        password: "{{TOMCAT_PASSWORD}}"
      resources:
        - name: applications
          path: /text
          description: "Web application lifecycle management"
          operations:
            - name: list-applications
              method: GET
              description: "List all deployed applications"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-application
              method: GET
              description: "Start a stopped web application"
              inputParameters:
                - name: path
                  in: query
                  type: string
                  required: true
                  description: "Application context path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stop-application
              method: GET
              description: "Stop a running web application"
              inputParameters:
                - name: path
                  in: query
                  type: string
                  required: true
                  description: "Application context path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: reload-application
              method: GET
              description: "Reload a web application"
              inputParameters:
                - name: path
                  in: query
                  type: string
                  required: true
                  description: "Application context path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: undeploy-application
              method: GET
              description: "Undeploy a web application"
              inputParameters:
                - name: path
                  in: query
                  type: string
                  required: true
                  description: "Application context path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: diagnostics
          path: /text
          description: "Server diagnostics"
          operations:
            - name: get-server-info
              method: GET
              description: "Get server OS, JVM, and version information"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-thread-dump
              method: GET
              description: "Get full JVM thread dump"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-vm-info
              method: GET
              description: "Get JVM memory and system properties"
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tomcat-rest
      resources:
        - path: /v1/applications
          name: applications
          description: "Application management"
          operations:
            - method: GET
              name: list-applications
              description: "List deployed applications"
              call: "tomcat.list-applications"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tomcat-mcp
      transport: http
      tools:
        - name: list-applications
          description: "List all deployed Tomcat web applications"
          hints:
            readOnly: true
            openWorld: false
          call: "tomcat.list-applications"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-application
          description: "Start a stopped Tomcat web application"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "tomcat.start-application"
          with:
            path: "tools.path"
          outputParameters:
            - type: object
              mapping: "$."
        - name: stop-application
          description: "Stop a running Tomcat web application"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "tomcat.stop-application"
          with:
            path: "tools.path"
          outputParameters:
            - type: object
              mapping: "$."
        - name: reload-application
          description: "Reload a Tomcat web application to pick up code changes"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "tomcat.reload-application"
          with:
            path: "tools.path"
          outputParameters:
            - type: object
              mapping: "$."
